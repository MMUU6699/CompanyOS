// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    ndkVersion = "28.2.13676358"
  } else if (project.name == "app") {
    project.tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }.configureEach { appCmakeTask ->
      appCmakeTask.doFirst {
        rootProject.subprojects.each { sub ->
          if (sub.name != "app") {
            def genSrc = new File("E:/b/android/${sub.name}/generated")
            def genDst = new File(sub.projectDir, "build/generated")
            if (genSrc.exists()) {
              project.copy {
                from genSrc
                into genDst
              }
            }
          }
        }
      }
    }
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  if (project != rootProject && project.name != "app") {
    def shortKey = Integer.toHexString(project.name.hashCode())
    project.layout.buildDirectory.set(new File("E:/b/android/${project.name}"))
    project.plugins.withId("com.android.library") {
      project.tasks.matching {
        it.name == "generateCodegenArtifactsFromSchema" ||
        it.name.startsWith("configureCMake") ||
        it.name.startsWith("buildCMake")
      }.configureEach { t ->
        t.doLast {
          def genSrc = new File("E:/b/android/${project.name}/generated")
          def genDst = new File(project.projectDir, "build/generated")
          if (genSrc.exists()) {
            project.copy {
              from genSrc
              into genDst
            }
          }
        }
      }
      project.android {
        externalNativeBuild {
          cmake {
            buildStagingDirectory = new File("E:/c/${shortKey}")
          }
        }
        defaultConfig {
          externalNativeBuild {
            cmake {
              arguments "-DCMAKE_OBJECT_PATH_MAX=160"
            }
          }
        }
      }
    }
  } else if (project.name == "app") {
    project.tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }.configureEach { appCmakeTask ->
      appCmakeTask.doFirst {
        rootProject.subprojects.each { sub ->
          if (sub.name != "app") {
            def genSrc = new File("E:/b/android/${sub.name}/generated")
            def genDst = new File(sub.projectDir, "build/generated")
            if (genSrc.exists()) {
              project.copy {
                from genSrc
                into genDst
              }
            }
          }
        }
      }
    }
  }
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
